name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **Fallen's Flyouts**: its folder is `FallensFlyouts` and its settings open with `/ff`.
  - type: textarea
    id: report
    attributes:
      label: What happened?
      description: What you saw and what you expected instead. Say which action bar and button it is about.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: What you dropped on which button, then what you pressed or clicked, in order. Say if it was in combat.
      placeholder: |
        1. Drop ... on the plus of ...
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Lua errors
      description: |
        If the game showed an error, paste the first one here. To see errors, type `/console scriptErrors 1`, or install BugSack and BugGrabber (both are needed).
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A screenshot helps more than anything. Drag the image into this box.
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Details from the addon
      description: Filled in for you by Report a Bug on the Feedback page of the addon's settings (`/ff status`). Came here another way? Paste what that page shows under Status, if you can.
      render: text
    validations:
      required: false
  - type: dropdown
    id: alone
    attributes:
      label: Does it still happen with only this addon turned on?
      description: Turn everything else off in the addon list, restart the interface and try once more.
      options:
        - "Yes, it still happens with only this addon on"
        - "No, it goes away with the rest turned off (say which one above if you found it)"
        - "I have no other addons"
        - "I did not try"
    validations:
      required: true
