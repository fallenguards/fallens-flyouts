name: Feature Request
description: Something the addon should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **Fallen's Flyouts**: its folder is `FallensFlyouts` and its settings open with `/ff`.
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: What it should do and what it would be for. A screenshot of the part of the screen helps.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details from the addon
      description: Filled in for you by Suggest an Idea on the Feedback page of the addon's settings (`/ff status`).
      render: text
    validations:
      required: false
